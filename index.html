<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream chat overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { font-synthesis: none; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  
  #chat {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px 16px;
    font-family: "DM Mono", ui-monospace, Menlo, Consolas, monospace; font-weight: 400;
    font-size: var(--size, 20px); line-height: 1.3; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.8);
  }
  
  .msg {
    padding: 3px 0; word-wrap: break-word; overflow-wrap: anywhere;
    animation: in .25s ease-out both; transition: opacity .6s ease;
  }
  .msg.out { opacity: 0; }
  .name { font-weight: 500; }
  .name::after { content: ":"; color: #fff; font-weight: 400; margin-right: .35em; }

  /* Notification Label Card for SFX and Commands */
  .msg.cmd-card {
    margin: 4px 0; padding: 6px 12px; width: fit-content; max-width: 100%;
    background: rgba(14, 12, 20, 0.88); border: 1px solid rgba(255, 255, 255, 0.15);
    border-left: 3px solid #3ec9b0; border-radius: 8px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
  }
  .cmd-card .user { font-weight: 700; color: #3ec9b0; }

  /* TTS Banner Label Card */
  .msg.tts-card {
    margin: 4px 0; padding: 8px 14px; width: fit-content; max-width: 100%;
    background: rgba(25, 18, 10, 0.9); border: 1px solid rgba(255, 196, 107, 0.35);
    border-left: 3px solid #ffc46b; border-radius: 8px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
  }
  .tts-card .tts-header { font-size: 0.75em; font-weight: 700; color: #ffc46b; text-transform: uppercase; letter-spacing: 0.05em; }
  .tts-card .tts-body { font-size: 1.05em; font-weight: 500; color: #fff; margin-top: 2px; }

  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div id="chat"></div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const CHANNEL = (params.get("channel") || "bogdanthegdplayer").toLowerCase();
  const FADE_S = parseFloat(params.get("fade") ?? "30");
  const MAX_MSG = Math.max(1, parseInt(params.get("max") || "6", 10));

  const chat = document.getElementById("chat");

  function readable(hex, name) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || "")) {
      let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 70% 65%)`;
    }
    return hex;
  }

  function dismiss(el) {
    if (!el || el._gone) return;
    el._gone = true;
    el.classList.add("out");
    setTimeout(() => el.remove(), 1000);
  }

  function push(el, fade = FADE_S) {
    chat.appendChild(el);
    const all = [...chat.children].filter(e => !e._gone);
    while (all.length > MAX_MSG) dismiss(all.shift());
    if (fade > 0) setTimeout(() => dismiss(el), fade * 1000);
    chat.scrollTop = chat.scrollHeight;
  }

  /* --- TTS Speech & Label Banner --- */
  const ttsQueue = [];
  let ttsBusy = false;

  function speakText(text) {
    return new Promise(resolve => {
      if (!("speechSynthesis" in window)) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.onend = u.onerror = () => resolve();
      window.speechSynthesis.speak(u);
    });
  }

  async function processTtsQueue() {
    if (ttsBusy || !ttsQueue.length) return;
    ttsBusy = true;
    const text = ttsQueue.shift();
    await speakText(text);
    ttsBusy = false;
    processTtsQueue();
  }

  function renderTtsLabel(user, text) {
    const el = document.createElement("div");
    el.className = "msg tts-card";
    
    const head = document.createElement("div");
    head.className = "tts-header";
    head.textContent = `${user} says:`;

    const body = document.createElement("div");
    body.className = "tts-body";
    body.textContent = text;

    el.append(head, body);
    push(el, 15);

    ttsQueue.push(text);
    processTtsQueue();
  }

  /* --- Sound Effects & Command Label Card --- */
  const SFX_LIST = new Set(["vineboom", "bruh", "cookie", "applause", "airhorn", "meow", "knocking", "drip", "bell", "rizz"]);

  function renderCmdLabel(user, cmdName) {
    const el = document.createElement("div");
    el.className = "msg cmd-card";
    
    const userSpan = document.createElement("span");
    userSpan.className = "user";
    userSpan.textContent = user;

    el.append(userSpan, document.createTextNode(` just played ${cmdName}!`));
    push(el, 10);
  }

  function handleCommand(tags, user, message) {
    const match = message.match(/^!([a-z0-9]+)(?:\s+(.*))?$/i);
    if (!match) return false;
    
    const cmd = match[1].toLowerCase();
    const displayName = tags["display-name"] || user;

    if (cmd === "tts") {
      const text = (match[2] || "").trim();
      if (text) renderTtsLabel(displayName, text);
      return true;
    }

    if (SFX_LIST.has(cmd)) {
      renderCmdLabel(displayName, cmd);
      return true;
    }

    // Suppress any other !commands from chat
    return true;
  }

  function renderChatLine(tags, user, message) {
    const displayName = tags["display-name"] || user;
    const el = document.createElement("div");
    el.className = "msg";

    const n = document.createElement("span");
    n.className = "name";
    n.textContent = displayName;
    n.style.color = readable(tags.color, displayName);

    const t = document.createElement("span");
    t.className = "text";
    t.textContent = message;

    el.append(n, t);
    return el;
  }

  function parseTags(raw) {
    const out = {};
    raw.split(";").forEach(p => { const i = p.indexOf("="); out[p.slice(0, i)] = p.slice(i + 1); });
    return out;
  }

  function connectTwitch() {
    const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 89999));
      ws.send("JOIN #" + CHANNEL);
    };

    ws.onmessage = (ev) => {
      ev.data.split("\r\n").filter(Boolean).forEach(line => {
        let tags = {}, rest = line;
        if (rest[0] === "@") { const i = rest.indexOf(" "); tags = parseTags(rest.slice(1, i)); rest = rest.slice(i + 1); }
        if (rest.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); return; }

        const parts = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #([^ ]+) :(.*)$/);
        if (parts) {
          const who = parts[1], text = parts[3];
          
          if (text.startsWith("!")) {
            handleCommand(tags, who, text);
          } else {
            push(renderChatLine(tags, who, text));
          }
        }
      });
    };

    ws.onclose = () => setTimeout(connectTwitch, 3000);
  }

  connectTwitch();
})();
</script>
</body>
</html>
